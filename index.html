<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="stylesheet" href="styles.css" />
    <script src="script.js" defer></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>picnic-spinner</title>
  </head>
  <body>
    <header>
      <h1>Picnic Spinner</h1>
      <h2>You put your name, spin and that's what you need to bring</h2>
    </header>
    <main>
      <section id="options">
        <h3>Options:</h3>
        <ul>
          <li>Drinks</li>
          <li>Food</li>
          <li>Snacks</li>
        </ul>
      </section>
      <section id="form">
        <form id="form">
          <label for="name">Name:</label>
          <input type="text" id="name" name="name" required />
          <button type="button" id="spin">Spin</button>
        </form>
      </section>
      <section id="message">
        <p>You can spin as many times as you want, however, only the first spin is counted</p>
      </section>
    </main>
    <footer>
      <p>Yours truly, mae :]</p>
    </footer>
  </body>
</html>
